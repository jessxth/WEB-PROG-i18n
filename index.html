<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Quiz zu I18N</title>
</head>

<body>
    <header>
        <div>
            <h1 id="title">Quiz</h1>
        </div>
        <div class="picker">
            <label id="languageLabel" for="language">Sprache</label>
            <select id="language" aria-label="Sprache wählen">

                <option value="ru">Русский</option>
                <option value="vi">Tiếng Việt</option>
            </select>
        </div>

    </header>

            <span id="score"></span>
            <! wird im script konfiguriert>
        </div>

                <legend id="Q1">1.Frage</legend>

                <div class="answer">
                    <input type="radio" name="Q1" value="A1" id="A1">
                    <label for="A1">Answer 1</label>
                </div>

                <div class="answer">
                    <input type="radio" name="Q1" value="A2" id="A2">
                    <label for="A2">Answer 2</label>
                </div>

                <div class="answer">

                    <label for="A3">Answer 3</label>

        </div>

        <div class="questionField">
            <fieldset>
